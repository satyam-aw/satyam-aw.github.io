name: Deploy site

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Refresh Google Scholar citations
        if: github.event_name != 'pull_request'
        id: citations
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m pip install 'scholarly==1.7.11' 'httpx==0.27.2' PyYAML
          timeout 90 python -u bin/update_scholar_citations.py
      - name: Report citation refresh failure
        if: steps.citations.outcome == 'failure'
        run: |
          echo "::warning::Google Scholar refresh failed. Deploying with saved citation counts."
          echo "Citation refresh failed; existing counts were preserved." >> "$GITHUB_STEP_SUMMARY"
      - name: Save refreshed citations
        if: steps.citations.outcome == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- _data/citations.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/citations.yml
            git commit -m "chore: update Google Scholar citations"
            if ! git push origin "HEAD:$SOURCE_BRANCH"; then
              echo "::warning::Could not save counts to source branch (branch protection or newer push). No force push attempted."
              echo "Refreshed counts are included in this build but could not be committed remotely." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
