        url: /projects/eeg-kinematics-decoding/
        location: Remote
        summary: "Guidance: Prof. Slawomir Nasuto (University of Reading)."
        highlights:
          - Built run-separated evaluation of wrist-position prediction from 32-channel EEG, using training-only scaling.
          - Compared six regression baselines; CNN-BiLSTM achieved R² = 0.809/0.783/0.748 for wrist X/Y/Z
            on held-out runs from one participant.
          - Cross-participant transfer and broader validation remain ongoing.
