    Research Questions:
      - bullet: How much can noisy physiological signals tell us about an intended action, and how early and precisely
          can we infer it?
      - bullet: How should a system act when that inference is uncertain?
    Research Experience:
      - company: Inria
        position: Research Collaboration — SSVEP-Based EEG Navigation
        start_date: 2026
        end_date: present
        url: /projects/bci_maze/
        location: Remote
        summary: Remote research collaboration under the guidance of Prof. Camille Gontier.
        highlights:
          - Developing a four-channel EEG interface for confidence-aware navigation in a C++/OpenGL maze.
          - Assembled BioAmp acquisition hardware with shared ground and reference; implemented visual targets and raw
            acquisition diagnostics.
          - Built photodiode capture hardware and Python tools to measure delivered stimulus timing.
          - Calibrated EEG streaming, CCA decoding, and EEG-controlled navigation remain integration and evaluation
            work.
      - company: University of Reading
        position: Research Collaboration — EEG-to-Kinematics Decoding
        start_date: 2026
        end_date: present
        url: /projects/eeg-kinematics-decoding/
        location: Remote
        summary: Remote research collaboration under the guidance of Prof. Slawomir Nasuto.
        highlights:
          - Predicting wrist X, Y, and Z position from 32-channel EEG using the WAY-EEG-GAL dataset.
          - Built run-separated evaluation with training-only scaling and windows that never cross recording-run boundaries.
          - Compared six regression baselines on held-out runs from participant P1; CNN–BiLSTM achieved R² of 0.809,
            0.783, and 0.748.
          - Results cover one participant and one seed; cross-participant transfer and broader validation remain future
            work.
      - company: Autonomous Systems Group, Imperial College London
        position: Research Collaboration — State-Dependent Robust Output-Feedback MPC
        start_date: 2026-07
        end_date: present
        url: /projects/state-dependent-robust-output-fb-mpc/
        location: Remote
        summary: Remote research collaboration under the guidance of Prof. Johannes Köhler.
        highlights:
          - Developing dynamic estimation and tracking-error bounds for state-dependent uncertainty using a reproduced
            ROHMPC certificate.
          - Reused the offline design's metric, observer gain, feedback gain, and LMI certificate to propagate coupled
            error bounds.
          - Illustrated a 6.68% final-time observer-radius reduction under a prescribed synthetic disturbance envelope.
          - The result is a tube-propagation illustration; closed-loop MPC integration and validation remain ongoing.
      - company: Four Eyes Laboratory, University of California, Santa Barbara
        position: Graduate Researcher — EyeTTS
        start_date: 2021-09
        end_date: 2023-06
        url: /projects/eyetts_for_mobile_mr/
        summary: "Advisor: Prof. Tobias Höllerer; co-advisor: Prof. Michael Beyeler."
        highlights:
          - Developed a Unity-based eye-tracking study platform and Python calibration and analysis pipeline for mixed-reality
            locomotion.
          - Studied gaze errors across target motion, head/body movement, and spatial reference frames.
          - Contributed the Magic Leap 1 study framework and calibration work; Vivian Ross and Sydney Lim developed
            the HoloLens 2 and Meta Quest Pro frameworks.
          - First-author poster papers appeared at IEEE ISMAR Adjunct 2023 and IEEE VR Workshops 2024.
      - company: Autonomous Ground Vehicle Group & Technology Robotix Society, IIT Kharagpur
        position: Undergraduate Researcher
        start_date: 2016-01
        end_date: 2018-12
        url: /projects/autonomous_ground_vehicle_and_swarm_robotics/
        highlights:
          - Contributed perception, multimodal state-estimation, and navigation components to Eklavya, the team's autonomous
            ground vehicle.
          - Worked on visual perception, hierarchical motion planning, local collision avoidance, and EKF-based sensor
            fusion in ROS.
          - Worked on robot coordination and drone projects through Technology Robotix Society.
