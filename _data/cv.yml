    Research Experience:
      - company: SSVEP-Based EEG Navigation
        position: Research Project
        start_date: 2026
        end_date: present
        url: /projects/ssvep_navigation/
        summary: "Guidance: Dr. Camille Gontier (Inria)."
        highlights:
          - Built a four-channel BioAmp/MG24 EEG system, a custom electrode cap, and photodiode timing tools.
          - Tested CCA decoding with one and four targets. Used recorded EEG to tune window length, harmonics, and
            decision thresholds.
          - Integrated live CCA decoding with a C++/OpenGL maze and tested the pipeline end to end.
      - company: EEG-to-Kinematics Decoding
        position: Research Project
        start_date: 2026
        end_date: present
        url: /projects/eeg-kinematics-decoding/
        summary: "Guidance: Prof. Slawomir Nasuto (University of Reading)."
        highlights:
          - Investigate how reliably EEG predicts wrist kinematics and whether stage-specific decoders improve prediction across movement phases.
          - Compared six wrist decoders; strong within-participant performance did not transfer reliably to 11 other participants without adaptation.
          - During loading, EEG distinguished three object weights on held-out switch trials with 55% balanced accuracy (33% chance).
      - company: Error-Related EEG During Mouse Movements
        position: Research Collaboration
        start_date: 2026
        end_date: present
        url: /projects/mouse-displacement-eeg/
        summary: "Guidance: Dr. Serafeim Perdikis (University of Essex); collaboration with Mushfika Sultana."
        highlights:
          - Cluster-based permutation tests on reaches matched for target entry identified significant EEG
            differences after target displacement.
          - Tested whether EEG could distinguish displaced from non-displaced trials on held-out runs within each
            participant and session, achieving 76.3% mean balanced accuracy across 23 non-pilot participants.
      - company: Sensory Feedback for Bidirectional Neural Interfaces
        position: Research Collaboration
        start_date: 2026
        end_date: present
        url: /projects/tens-eeg-waveform-decoding/
        summary: "Guidance: Prof. Mohsen Rakhshan (University of Central Florida)."
        highlights:
          - Studying how peripheral stimulation waveforms relate to EEG responses and perceived sensation.
          - Testing whether single EEG epochs distinguish five waveforms across participants while checking for
            stimulation and task confounds.
      - company: Robust Output-Feedback MPC
        position: Research Project
        start_date: 2026-07
        end_date: present
        url: /projects/state-dependent-robust-output-fb-mpc/
        summary: "Guidance: Dr. Johannes Köhler (Imperial College London)."
        highlights:
          - Developing joint bounds for state-estimation and tracking errors under state-dependent uncertainty.
          - Reduced the final observer radius by 6.68% in a synthetic bound-propagation experiment. Closed-loop
            validation is ongoing.
      - company: Four Eyes Laboratory, UC Santa Barbara
        position: Graduate Researcher - EyeTTS
        start_date: 2022-01
        end_date: 2023-03
        url: /projects/eyetts_for_mobile_mr/
        summary: "Advisor: Prof. Tobias Höllerer; co-advisor: Prof. Michael Beyeler."
        highlights:
          - Built a Magic Leap 1 eye-tracking study and a Python pipeline for calibration and analysis during
            mixed-reality locomotion.
          - Analysed gaze error and timing during target, head, and body movement. First author on two poster
            papers.
      - company: Undergraduate Robotics Research, IIT Kharagpur
        position: ""
        start_date: 2016
        end_date: 2018
        summary: Perception, sensor fusion, and navigation for the Eklavya autonomous ground vehicle.
